<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enregistreur audio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Enregistreur audio</h1>
    <div id="timer">00:00</div>
    <canvas id="wave"></canvas>

    <p id="message" hidden></p>

    <div class="controls">
      <button id="btnStart">Démarrer</button>
      <button id="btnPause" hidden>Pause</button>
      <button id="btnStop" class="danger" hidden>Arrêter</button>
    </div>

    <section id="playback" hidden>
      <h2 id="playTitle"></h2>
      <canvas id="playWave"></canvas>
      <audio id="player" controls></audio>
    </section>

    <section>
      <h2>Enregistrements</h2>
      <ul id="list"></ul>
      <p id="empty">Aucun enregistrement pour le moment.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
